<nav class="navbar navbar-light">
  <div class="container">
    <a class="navbar-brand" routerLink="/">ReDuX Ai</a>
    <ul class="nav navbar-nav pull-xs-right">
      <li class="nav-item">
        <a class="nav-link" routerLink="/">Home</a>
      </li>
      @if (currentUser$ | async; as currentUser) {
        <li class="nav-item">
          <a class="nav-link" routerLink="/editor">
            <i class="ion-compose"></i>&nbsp;New Article
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/settings">
            <i class="ion-gear-a"></i>&nbsp;Settings
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" [routerLink]="['/profile', currentUser.username]">
            <img [src]="currentUser.image" class="user-pic" />
            {{ currentUser.username }}
          </a>
        </li>
      } @else {
        <li class="nav-item">
          <a class="nav-link" routerLink="/login">Sign in</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/register">Sign up</a>
        </li>
      }
    </ul>
  </div>
</nav>
