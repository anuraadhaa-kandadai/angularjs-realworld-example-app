<div class="home-page">

  <!-- Splash banner that only shows when not logged in -->
  @if (!isAuthenticated()) {
    <div class="banner">
      <div class="container">
        <h1 class="logo-font">{{ appName | lowercase }}</h1>
        <p>A place to share your knowledge.</p>
      </div>
    </div>
  }

  <div class="container page">
    <div class="row">

      <!-- Main view - contains tabs & article list -->
      <div class="col-md-9">
        <!-- Tabs for toggling between feed, article lists -->
        <div class="feed-toggle">
          <ul class="nav nav-pills outline-active">

            @if (isAuthenticated()) {
              <li class="nav-item">
                <a class="nav-link"
                   [ngClass]="{ active: listConfig.type === 'feed' }"
                   (click)="changeList({ type: 'feed' })">
                  Your Feed
                </a>
              </li>
            }

            <li class="nav-item">
              <a class="nav-link"
                 [ngClass]="{ active: listConfig.type === 'all' && !listConfig.filters }"
                 (click)="changeList({ type: 'all' })">
                Global Feed
              </a>
            </li>

            <!-- @if (listConfig.filters?.tag) {
              <li class="nav-item">
                <a class="nav-link active">
                  <i class="ion-pound"></i> {{listConfig.filters.tag}}
                </a>
              </li>
            } -->

          </ul>
        </div>

        <!-- List the current articles -->
        <app-article-list [limit]="10" [listConfig]="listConfig"></app-article-list>

      </div>

      <!-- Sidebar where popular tags are listed -->
      <div class="col-md-3">
        <div class="sidebar">

          <p>Popular Tags</p>

          <!-- Commented out until tags functionality is implemented -->
          <!--
          @if (tags) {
            <div class="tag-list">
              @for (tagName of tags; track tagName) {
                <a class="tag-default tag-pill"
                   (click)="changeList({ type: 'all', filters: { tag: tagName } })">
                  {{ tagName }}
                </a>
              }
            </div>
          } @else if (!tagsLoaded) {
            <div>
              Loading tags...
            </div>
          } @else {
            <div class="post-preview">
              No tags are here... yet.
            </div>
          }
          -->

        </div>
      </div>

      <!-- End the row & container divs -->
    </div>
  </div>

</div>
