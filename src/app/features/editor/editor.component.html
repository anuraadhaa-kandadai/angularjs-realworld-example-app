<div class="editor-page">
  <div class="container page">
    <div class="row">
      <div class="col-md-10 offset-md-1 col-xs-12">
        <form [formGroup]="articleForm" (ngSubmit)="submit()">
          <fieldset [disabled]="isSubmitting">
            <fieldset class="form-group">
              <input class="form-control form-control-lg" formControlName="title" type="text" placeholder="Article Title">
            </fieldset>
            <fieldset class="form-group">
              <input class="form-control" formControlName="description" type="text" placeholder="What's this article about?">
            </fieldset>
            <fieldset class="form-group">
              <textarea class="form-control" formControlName="body" rows="8" placeholder="Write your article (in markdown)"></textarea>
            </fieldset>
            <fieldset class="form-group">
              <input class="form-control" type="text" placeholder="Enter tags" [(ngModel)]="tagField" [ngModelOptions]="{standalone: true}" (keyup.enter)="addTag()">
              <div class="tag-list">
                <span class="tag-default tag-pill" *ngFor="let tag of tagList.controls; let i = index">
                  <i class="ion-close-round" (click)="removeTag(i)"></i>
                  {{ tag.value }}
                </span>
              </div>
            </fieldset>
            <button class="btn btn-lg pull-xs-right btn-primary" type="submit">
              Publish Article
            </button>
          </fieldset>
        </form>
      </div>
    </div>
  </div>
</div>
